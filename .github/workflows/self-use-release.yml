name: Self-use Passwordless Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: self-use-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check modified Rust source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.75"
          components: rustfmt

      - name: Check modified Rust source formatting
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${{ github.sha }}^"
          fi
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$base" "${{ github.sha }}" -- '*.rs')
          if (( ${#files[@]} == 0 )); then
            echo "No Rust source files changed"
            exit 0
          fi
          printf 'Checking %s\n' "${files[@]}"
          rustfmt --check --edition 2021 "${files[@]}"

  prepare-release:
    name: Create unique release identity
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - name: Remove incomplete self-use drafts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r release_id; do
            if [ -n "$release_id" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            fi
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == true and (.tag_name | startswith("self-use-"))) | .id'
          )

      - name: Generate release tag and title
        id: release
        shell: bash
        run: |
          value="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          tag="self-use-${value}"
          title="自用免密构建 ${value}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build and publish self-use release
    needs: prepare-release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ needs.prepare-release.outputs.tag }}
      release-name: ${{ needs.prepare-release.outputs.title }}
