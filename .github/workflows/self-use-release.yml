name: Self-use Passwordless Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: self-use-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check changed files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${{ github.sha }}^"
          fi
          git diff --check "$base" "${{ github.sha }}" --

  prepare-release:
    name: Create unique release identity
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - name: Remove incomplete self-use drafts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r release_id; do
            if [ -n "$release_id" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            fi
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == true and (.tag_name | startswith("self-use-"))) | .id'
          )

      - name: Generate release tag and title
        id: release
        shell: bash
        run: |
          value="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          tag="self-use-${value}"
          title="自用免密构建 ${value}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build and publish self-use release
    needs: prepare-release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ needs.prepare-release.outputs.tag }}
      release-name: ${{ needs.prepare-release.outputs.title }}

  cleanup-failed-release:
    name: Remove incomplete release
    needs:
      - prepare-release
      - build-and-release
    if: ${{ always() && needs.prepare-release.result == 'success' && needs.build-and-release.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove this run's draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
              --jq '.id' 2>/dev/null || true
          )"
          if [ -n "$release_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
